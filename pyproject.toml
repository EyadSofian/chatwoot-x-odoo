[project]
name = "chatwoot-odoo-bridge"
version = "0.1.0"
description = "FastAPI bridge that displays Odoo 17 CRM, contacts, and sales order data inside Chatwoot."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
